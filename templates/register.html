{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7" data-aos="fade-up">
            <div class="glass-card form-shell">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-compass text-gradient" style="font-size: 2rem;"></i>
                    <h3 class="text-white mt-2 mb-0">Create your account</h3>
                    <p class="text-muted-soft small">Unlock AI itineraries, saved trips, and personalized recommendations.</p>
                </div>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="post" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Profile picture (optional)</label>
                            <input type="file" name="profile_picture" class="form-control" accept="image/*">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Full name</label>
                            <input name="name" class="form-control" placeholder="Jordan Lee" value="{{ form.name if form else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input name="email" type="email" class="form-control" placeholder="you@example.com" value="{{ form.email if form else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input name="phone" class="form-control" placeholder="+91 98765 43210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Country</label>
                            <input name="country" class="form-control" placeholder="India">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control pw-input" placeholder="At least 8 characters" required>
                            <div class="password-meter"><span></span></div>
                            <div class="password-meter-label small text-muted-soft mt-1"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm password</label>
                            <input name="confirm_password" type="password" class="form-control" placeholder="Re-enter password" required>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label small" for="terms">I agree to the Terms of Service and Privacy Policy</label>
                            </div>
                        </div>
                        <div class="col-12"><button class="btn btn-primary w-100 rounded-pill py-2">Create Account</button></div>
                    </div>
                </form>
                <p class="text-center text-muted-soft small mt-4 mb-0">
                    Already have an account? <a href="{{ url_for('login') }}" class="text-gradient text-decoration-none fw-semibold">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
