{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="min-height: 70vh; display:flex; align-items:center;">
    <div class="row justify-content-center w-100">
        <div class="col-md-5" data-aos="fade-up">
            <div class="glass-card form-shell">
                <h3 class="text-white mb-3">Set a new password</h3>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">New password</label>
                        <div class="password-field">
                            <input type="password" name="password" class="form-control pw-input" placeholder="At least 8 characters" required>
                            <button type="button" class="password-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                        <div class="password-meter"><span></span></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm password</label>
                        <div class="password-field">
                            <input type="password" name="confirm_password" class="form-control" required>
                            <button type="button" class="password-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 rounded-pill py-2">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
