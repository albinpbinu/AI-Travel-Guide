{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="min-height: 78vh; display:flex; align-items:center;">
    <div class="row justify-content-center w-100">
        <div class="col-md-5" data-aos="fade-up">
            <div class="glass-card form-shell">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-compass text-gradient" style="font-size: 2rem;"></i>
                    <h3 class="text-white mt-2 mb-0">Welcome back</h3>
                    <p class="text-muted-soft small">Log in to plan your next AI-powered trip.</p>
                </div>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember">
                            <label class="form-check-label small" for="remember">Remember me</label>
                        </div>
                        <a href="{{ url_for('forgot_password') }}" class="small text-soft">Forgot password?</a>
                    </div>
                    <button class="btn btn-primary w-100 rounded-pill py-2">Login</button>
                </form>
                <p class="text-center text-muted-soft small mt-4 mb-0">
                    Don't have an account? <a href="{{ url_for('register') }}" class="text-gradient text-decoration-none fw-semibold">Create one</a>
                </p>
                <p class="text-center text-muted-soft small mt-2 mb-0">Demo login: demo@travelguide.ai / demo1234</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
